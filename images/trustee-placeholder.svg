<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Placeholder for a trustee portrait">
  <defs>
    <linearGradient id="avbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4EFD5"/>
      <stop offset="100%" stop-color="#C4DCAE"/>
    </linearGradient>
    <linearGradient id="avfig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FBF3F"/>
      <stop offset="100%" stop-color="#5F8F26"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#avbg)"/>

  <!-- concentric arcs -->
  <g fill="none" stroke="#12341F" stroke-opacity="0.09" stroke-width="1.4">
    <circle cx="200" cy="215" r="88"/>
    <circle cx="200" cy="215" r="122"/>
    <circle cx="200" cy="215" r="158"/>
  </g>

  <!-- person silhouette -->
  <circle cx="200" cy="178" r="52" fill="url(#avfig)" opacity="0.9"/>
  <path d="M104 400 C104 322 148 272 200 272 C252 272 296 322 296 400 Z" fill="url(#avfig)" opacity="0.9"/>

  <!-- camera hint: replace -->
  <g transform="translate(200 400)">
    <rect x="-15" y="-9" width="30" height="21" rx="5" fill="none" stroke="#12341F" stroke-opacity="0.42" stroke-width="2.2"/>
    <circle cx="0" cy="1.5" r="5.5" fill="none" stroke="#12341F" stroke-opacity="0.42" stroke-width="2.2"/>
  </g>

  <!-- label -->
  <g transform="translate(0 452)">
    <rect x="0" y="0" width="400" height="48" fill="#12341F"/>
    <text x="200" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif"
          font-size="13" font-weight="700" fill="#8FBF3F" letter-spacing="1.2">
      ADD A REAL PHOTOGRAPH
    </text>
  </g>
</svg>

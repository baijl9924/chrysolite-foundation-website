<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder for the CAC certificate image">
  <defs>
    <linearGradient id="docbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4EFD5"/>
      <stop offset="100%" stop-color="#C9DEB4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8EE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#docbg)"/>

  <!-- faint dot texture -->
  <g fill="#12341F" opacity="0.07">
    <circle cx="60" cy="60" r="3"/><circle cx="160" cy="60" r="3"/><circle cx="260" cy="60" r="3"/>
    <circle cx="360" cy="60" r="3"/><circle cx="460" cy="60" r="3"/><circle cx="560" cy="60" r="3"/>
    <circle cx="660" cy="60" r="3"/><circle cx="760" cy="60" r="3"/>
    <circle cx="60" cy="440" r="3"/><circle cx="160" cy="440" r="3"/><circle cx="260" cy="440" r="3"/>
    <circle cx="360" cy="440" r="3"/><circle cx="460" cy="440" r="3"/><circle cx="560" cy="440" r="3"/>
    <circle cx="660" cy="440" r="3"/><circle cx="760" cy="440" r="3"/>
  </g>

  <!-- certificate sheet -->
  <g transform="translate(210 62)">
    <rect x="6" y="8" width="374" height="372" rx="6" fill="#12341F" opacity="0.12"/>
    <rect x="0" y="0" width="374" height="372" rx="6" fill="url(#paper)" stroke="#12341F" stroke-opacity="0.18"/>
    <rect x="16" y="16" width="342" height="340" rx="3" fill="none" stroke="#8FBF3F" stroke-width="2.5"/>
    <rect x="24" y="24" width="326" height="324" rx="2" fill="none" stroke="#8FBF3F" stroke-width="0.9" stroke-opacity="0.55"/>

    <!-- seal -->
    <circle cx="187" cy="104" r="34" fill="none" stroke="#8FBF3F" stroke-width="3"/>
    <path d="M187 78 L203 87 L203 105 L187 114 L171 105 L171 87 Z" fill="#8FBF3F" opacity="0.85"/>

    <!-- text bars -->
    <rect x="86" y="164" width="202" height="13" rx="6.5" fill="#12341F" opacity="0.72"/>
    <rect x="110" y="188" width="154" height="9" rx="4.5" fill="#12341F" opacity="0.34"/>
    <rect x="72" y="222" width="230" height="8" rx="4" fill="#12341F" opacity="0.22"/>
    <rect x="88" y="242" width="198" height="8" rx="4" fill="#12341F" opacity="0.22"/>
    <rect x="100" y="262" width="174" height="8" rx="4" fill="#12341F" opacity="0.22"/>
    <rect x="96" y="300" width="120" height="7" rx="3.5" fill="#8FBF3F" opacity="0.75"/>
    <rect x="240" y="300" width="70" height="7" rx="3.5" fill="#8FBF3F" opacity="0.75"/>
  </g>

  <!-- label -->
  <g transform="translate(0 452)">
    <rect x="0" y="0" width="800" height="48" fill="#12341F"/>
    <text x="400" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif"
          font-size="15" font-weight="700" fill="#8FBF3F" letter-spacing="1.6">
      REPLACE WITH A PHOTOGRAPH OF YOUR CAC CERTIFICATE
    </text>
  </g>
</svg>

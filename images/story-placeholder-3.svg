<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photo placeholder 3">
  <defs>
    <linearGradient id="sp3" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(60 .5 .5)">
      <stop offset="0" stop-color="#12341F"/>
      <stop offset=".6" stop-color="#1E4C31"/>
      <stop offset="1" stop-color="#2A6340"/>
    </linearGradient>
    <radialGradient id="spg3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8FBF3F" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8FBF3F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spp3" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#F2F8E6" fill-opacity=".14"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#sp3)"/>
  <rect width="800" height="500" fill="url(#spp3)"/>
  <circle cx="640" cy="90" r="240" fill="url(#spg3)"/>
  <rect x="80" y="300" width="200" height="120" rx="18" fill="#8FBF3F" fill-opacity=".15" transform="rotate(-12 180 360)"/><rect x="140" y="360" width="160" height="90" rx="14" fill="#A8D158" fill-opacity=".12" transform="rotate(8 220 405)"/>
  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif">
    <text x="400" y="242" font-size="30" font-weight="700" fill="#F2F8E6" fill-opacity=".92" letter-spacing="2">PHOTO PLACEHOLDER</text>
    <text x="400" y="282" font-size="19" fill="#C6D6BC" fill-opacity=".85">Replace with a real photo from this program</text>
  </g>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#8FBF3F" stroke-opacity=".35" stroke-width="3" stroke-dasharray="14 10"/>
</svg>
